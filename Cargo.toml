[package]
name = "kid-control3"
version = "0.1.0"
edition = "2021"
description = "家庭平板控制系统 v3 — Rust 重写"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for ROS REST API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time", "chrono"] }

# Chinese holiday calendar
chinese_holiday = { version = "2026.0", default-features = true, features = ["chrono-compatible"] }

# Config
dotenvy = "0.15"

# Utilities
anyhow = "1"
lazy_static = "1"
once_cell = "1"
regex = "1"
thiserror = "2"
