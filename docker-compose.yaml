services:
  kid-control3:
    build: .
    container_name: kid-control3
    restart: unless-stopped
    network_mode: host
    environment:
      - DB_PATH=/data/kid-control.db
      - LISTEN_ADDR=0.0.0.0:18089
      - ROS_HOST=${ROS_HOST}
      - ROS_PORT=${ROS_PORT:-80}
      - ROS_USER=${ROS_USER}
      - ROS_PASS=${ROS_PASS}
      - MOSDNS_URL=${MOSDNS_URL}
    volumes:
      - ./data:/data
