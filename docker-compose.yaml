services:
  kid-control3:
    image: kirin1989/kid-control3:latest
    container_name: kid-control3
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      # ROS 路由器
      ROS_HOST: "${ROS_HOST}"
      ROS_PORT: "${ROS_PORT:-80}"
      ROS_USER: "${ROS_USER}"
      ROS_PASS: "${ROS_PASS}"
      # DNS 采集（MOSDNS）
      MOSDNS_URL: "${MOSDNS_URL:-http://127.0.0.1:9099}"
      # 监听地址
      LISTEN_ADDR: "0.0.0.0:18089"
      # 时区（必须设，否则时间过滤偏差8小时）
      TZ: "Asia/Shanghai"
      # 数据库路径（容器内）
      DB_PATH: "/data/kid-control.db"
      # Telegram 积分审批
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
