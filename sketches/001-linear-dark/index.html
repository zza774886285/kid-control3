<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kid-control3 — Linear Dark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0a0a0f;
      --bg-elevated: #111118;
      --bg-card: rgba(255,255,255,0.03);
      --bg-card-hover: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
      --text-primary: #ededf0;
      --text-secondary: #8b8b9e;
      --text-muted: #55556a;
      --accent-purple: #8b5cf6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --radius: 12px;
      --radius-sm: 8px;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout */
    .layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 220px;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar-logo {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      padding: 8px 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-logo span {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
    .nav-item.active { background: rgba(139,92,246,0.12); color: var(--accent-purple); }

    .main { flex: 1; padding: 32px 40px; max-width: 960px; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
    .header-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 500;
    }
    .refresh-btn {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .refresh-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-secondary); }

    /* Device Cards — border 联动 */
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .device-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .device-card:hover { background: var(--bg-card-hover); border-color: var(--border-hover); }
    /* 断网状态 — 红色边框 */
    .device-card.blocked {
      border-color: rgba(239, 68, 68, 0.3);
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.1), inset 0 0 30px rgba(239, 68, 68, 0.03);
    }
    .device-card.blocked::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
      opacity: 0.6;
    }
    /* 正常状态 — 设备色边框 */
    .device-card.online:not(.blocked) {
      border-color: rgba(34, 197, 94, 0.15);
    }
    .device-card.online:not(.blocked)::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(34, 197, 94, 0.4), transparent);
    }
    .device-card.offline {
      border-color: rgba(100, 100, 120, 0.15);
      opacity: 0.6;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-header-left { display: flex; align-items: center; gap: 10px; }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .status-dot.online { background: var(--accent-green); box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    .status-dot.offline { background: var(--text-muted); }
    .device-name { font-size: 14px; font-weight: 600; }
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .badge-red { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
    .badge-amber { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
    .badge-green { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }

    .mac { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }

    /* Usage Bar */
    .usage-section { margin-bottom: 16px; }
    .usage-numbers { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .usage-big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .usage-label { font-size: 12px; color: var(--text-muted); }
    .progress-track {
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Activity chips */
    .activity-chips { display: flex; gap: 8px; margin-bottom: 16px; }
    .chip {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
    }
    .chip-blue { background: rgba(59,130,246,0.12); color: #60a5fa; }
    .chip-orange { background: rgba(249,115,22,0.12); color: #fb923c; }
    .chip-muted { background: rgba(255,255,255,0.04); color: var(--text-muted); }

    /* Action pills */
    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .pill:hover { background: rgba(255,255,255,0.08); border-color: var(--border-hover); color: var(--text-primary); }
    .pill-danger { border-color: rgba(239,68,68,0.2); color: #f87171; }
    .pill-danger:hover { background: rgba(239,68,68,0.1); }
    .pill-success { border-color: rgba(34,197,94,0.2); color: #4ade80; }
    .pill-success:hover { background: rgba(34,197,94,0.1); }

    /* ====== NEW: 本周使用概览卡片 ====== */
    .overview-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
    }
    .overview-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .overview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 16px;
    }
    /* 今日剩余 — 大数字 */
    .stat-block {}
    .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
    .stat-unit { font-size: 12px; font-weight: 400; color: var(--text-muted); margin-left: 2px; }
    .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* 迷你柱状图 */
    .mini-chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 56px;
      padding-top: 4px;
    }
    .mini-bar-group {
      flex: 1;
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 100%;
    }
    .mini-bar {
      flex: 1;
      border-radius: 2px 2px 0 0;
      min-height: 2px;
      transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .mini-bar:hover { opacity: 0.8; }
    .mini-bar-label {
      text-align: center;
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 6px;
      font-family: var(--font-mono);
    }
    .chart-days {
      display: flex;
      gap: 3px;
    }
    .chart-day { flex: 1; }
    .chart-day-label {
      text-align: center;
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* 设备占比条 */
    .device-bars { margin-top: 12px; }
    .device-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .device-bar-label { font-size: 11px; color: var(--text-secondary); width: 48px; flex-shrink: 0; }
    .device-bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .device-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
    .device-bar-value { font-size: 11px; color: var(--text-muted); width: 40px; text-align: right; font-family: var(--font-mono); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 20px 16px; }
      .cards { grid-template-columns: 1fr; }
      .overview-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>kid-control</span>
      </div>
      <div class="nav-item active">📊 仪表盘</div>
      <div class="nav-item">⭐ 积分</div>
      <div class="nav-item">⚙️ 设置</div>
    </nav>

    <!-- Main -->
    <main class="main">
      <div class="header">
        <div style="display:flex;align-items:center;gap:12px;">
          <h1>仪表盘</h1>
          <span class="header-badge">工作日</span>
        </div>
        <button class="refresh-btn">🔄 刷新</button>
      </div>

      <!-- 设备卡片 -->
      <div class="cards">
        <!-- 华为 — 在线正常 -->
        <div class="device-card online">
          <div class="card-header">
            <div class="card-header-left">
              <div class="status-dot online"></div>
              <span class="device-name">华为</span>
              <span class="badge badge-green">正常</span>
            </div>
            <span class="mac">A0:DE:0F:45:2D:39</span>
          </div>
          <div class="usage-section">
            <div class="usage-numbers">
              <span class="usage-big">1h 23m</span>
              <span class="usage-label">限额 2h · 69%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:69%;background:linear-gradient(90deg,#8b5cf6,#8b5cf6);box-shadow:0 0 8px rgba(139,92,246,0.4)"></div>
            </div>
          </div>
          <div class="activity-chips">
            <span class="chip chip-blue">📺 视频 45min</span>
            <span class="chip chip-orange">🎮 游戏 12min</span>
          </div>
          <div class="actions">
            <button class="pill">➕ 30min</button>
            <button class="pill">➖ 30min</button>
            <button class="pill pill-danger">🔴 断网</button>
            <button class="pill">⏸️ 暂停</button>
          </div>
        </div>

        <!-- iPad — 断网状态 -->
        <div class="device-card blocked">
          <div class="card-header">
            <div class="card-header-left">
              <div class="status-dot offline"></div>
              <span class="device-name">iPad</span>
              <span class="badge badge-red">已封禁</span>
            </div>
            <span class="mac">80:5F:C5:31:4D:5E</span>
          </div>
          <div class="usage-section">
            <div class="usage-numbers">
              <span class="usage-big" style="color:var(--accent-red)">2h 05m</span>
              <span class="usage-label">限额 1h 30m · <span style="color:var(--accent-red)">超限</span></span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:100%;background:linear-gradient(90deg,#ef4444,#ef4444);box-shadow:0 0 8px rgba(239,68,68,0.4)"></div>
            </div>
          </div>
          <div class="activity-chips">
            <span class="chip chip-blue">📺 视频 1h 30min</span>
          </div>
          <div class="actions">
            <button class="pill">➕ 30min</button>
            <button class="pill">➖ 30min</button>
            <button class="pill pill-success">🟢 恢复</button>
            <button class="pill">⏸️ 暂停</button>
          </div>
        </div>
      </div>

      <!-- ====== 本周使用概览 ====== -->
      <div class="overview-card">
        <div class="overview-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
          本周使用概览
        </div>
        <div class="overview-grid">
          <!-- 今日剩余 -->
          <div class="stat-block">
            <div class="stat-label">今日剩余</div>
            <div class="stat-value" style="color:var(--accent-purple)">37<span class="stat-unit">min</span></div>
            <div class="stat-sub">两台设备合计</div>
          </div>

          <!-- 本周趋势 -->
          <div>
            <div class="stat-label" style="margin-bottom:8px">本周趋势</div>
            <div class="mini-chart">
              <div class="chart-days">
                <div class="chart-day">
                  <div class="mini-bar-group">
                    <div class="mini-bar" style="height:45%;background:#8b5cf6"></div>
                    <div class="mini-bar" style="height:30%;background:#06b6d4"></div>
                  </div>
                  <div class="chart-day-label">一</div>
                </div>
                <div class="chart-day">
                  <div class="mini-bar-group">
                    <div class="mini-bar" style="height:60%;background:#8b5cf6"></div>
                    <div class="mini-bar" style="height:55%;background:#06b6d4"></div>
                  </div>
                  <div class="chart-day-label">二</div>
                </div>
                <div class="chart-day">
                  <div class="mini-bar-group">
                    <div class="mini-bar" style="height:35%;background:#8b5cf6"></div>
                    <div class="mini-bar" style="height:80%;background:#ef4444"></div>
                  </div>
                  <div class="chart-day-label">三</div>
                </div>
                <div class="chart-day">
                  <div class="mini-bar-group">
                    <div class="mini-bar" style="height:70%;background:#8b5cf6"></div>
                    <div class="mini-bar" style="height:40%;background:#06b6d4"></div>
                  </div>
                  <div class="chart-day-label">四</div>
                </div>
                <div class="chart-day">
                  <div class="mini-bar-group">
                    <div class="mini-bar" style="height:50%;background:#8b5cf6"></div>
                    <div class="mini-bar" style="height:25%;background:#06b6d4"></div>
                  </div>
                  <div class="chart-day-label">五</div>
                </div>
                <div class="chart-day">
                  <div class="mini-bar-group">
                    <div class="mini-bar" style="height:85%;background:#ef4444"></div>
                    <div class="mini-bar" style="height:65%;background:#ef4444"></div>
                  </div>
                  <div class="chart-day-label">六</div>
                </div>
                <div class="chart-day">
                  <div class="mini-bar-group">
                    <div class="mini-bar" style="height:40%;background:#8b5cf6"></div>
                    <div class="mini-bar" style="height:95%;background:#ef4444;opacity:0.5"></div>
                  </div>
                  <div class="chart-day-label">日</div>
                </div>
              </div>
            </div>
          </div>

          <!-- 设备使用占比 -->
          <div>
            <div class="stat-label" style="margin-bottom:8px">今日使用占比</div>
            <div class="device-bars">
              <div class="device-bar-row">
                <span class="device-bar-label" style="color:#8b5cf6">华为</span>
                <div class="device-bar-track">
                  <div class="device-bar-fill" style="width:40%;background:#8b5cf6"></div>
                </div>
                <span class="device-bar-value">1h 23m</span>
              </div>
              <div class="device-bar-row">
                <span class="device-bar-label" style="color:#06b6d4">iPad</span>
                <div class="device-bar-track">
                  <div class="device-bar-fill" style="width:60%;background:#ef4444"></div>
                </div>
                <span class="device-bar-value" style="color:#f87171">2h 05m</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
